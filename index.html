<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>100,000 Pixels Grid</title>
  <style>
    body {
      margin: 0;
      background-color: #0d0d0d;
      font-family: sans-serif;
      color: white;
      overflow: hidden;
    }

    h1 {
      text-align: center;
      padding: 20px;
      font-size: 2em;
      background: linear-gradient(to right, #ff00cc, #3333ff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    #pixelGrid {
      display: grid;
      grid-template-columns: repeat(1000, 1fr);
      width: 100vw;
      height: calc(100vh - 60px);
    }

    .pixel {
      width: 100%;
      height: 100%;
      background-color: #1a1a1a;
      border: 0.1px solid #111;
    }

    .pixel img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    a.pixel-link {
      display: block;
      width: 100%;
      height: 100%;
    }

    @media (max-width: 768px) {
      #pixelGrid {
        transform: scale(0.2);
        transform-origin: top left;
      }
    }
  </style>
</head>
<body>
  <h1>PixelVault — Own A Piece Of Internet History</h1>
  <div id="pixelGrid"></div>

  <script>
    const grid = document.getElementById("pixelGrid");
    const totalPixels = 100000;

    // Example: Pull logos + links from external source later
    const customers = [
      { id: 1, logo: "https://picsum.photos/50?random=1", url: "https://example.com" },
      { id: 2, logo: "https://picsum.photos/50?random=2", url: "https://another.com" }
    ];

    for (let i = 0; i < totalPixels; i++) {
      const pixel = document.createElement("div");
      pixel.classList.add("pixel");

      // 1 out of every 200 pixels is marked "sold"
      if (Math.random() < 0.005) {
        const customer = customers[Math.floor(Math.random() * customers.length)];
        pixel.innerHTML = `
          <a href="${customer.url}" target="_blank" class="pixel-link">
            <img src="${customer.logo}" alt="Ad" />
          </a>
        `;
      }

      grid.appendChild(pixel);
    }
  </script>
</body>
</html>
