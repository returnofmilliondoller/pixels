<!DOCTYPE html><html lang="en"><head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AIVOX - AI Solutions</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" />
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Roboto', sans-serif;
    }body {
  background: linear-gradient(135deg, #1f3c88, #9b28b1);
  color: white;
  padding: 20px;
  text-align: center;
}

header {
  margin-top: 30px;
}

.logo {
  width: 120px;
  margin-bottom: 20px;
}

h1 {
  font-size: 48px;
  font-weight: bold;
}

.tagline {
  font-size: 20px;
  margin-top: 10px;
  margin-bottom: 40px;
}

section {
  margin: 40px 0;
}

.industries {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
  gap: 20px;
  margin-top: 20px;
}

.industry-box {
  background: rgba(255, 255, 255, 0.1);
  padding: 20px;
  border-radius: 12px;
  backdrop-filter: blur(5px);
  font-weight: bold;
}

footer {
  margin-top: 50px;
  font-size: 14px;
}

  </style>
</head><body>
  <header>
    <img src="A_digital_vector_graphic_features_the_logo_and_bra.png" alt="AIVOX Logo" class="logo" />
    <h1>AIVOX</h1>
    <p class="tagline">Empowering the Future with Artificial Intelligence</p>
  </header>  <section>
    <h2>Trusted by Leading Industries</h2>
    <div class="industries">
      <div class="industry-box">Healthcare</div>
      <div class="industry-box">Finance</div>
      <div class="industry-box">E-commerce</div>
      <div class="industry-box">Automotive</div>
      <div class="industry-box">Education</div>
      <div class="industry-box">Cybersecurity</div>
    </div>
  </section>  <footer>
    &copy; 2025 AIVOX. All rights reserved.
  </footer>
</body></html>
