<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Return of Million Dollar Homepage</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      margin: 0;
      background-color: black;
      font-family: sans-serif;
      color: white;
    }
    .pixel-grid {
      display: grid;
      grid-template-columns: repeat(200, 1fr);
      gap: 1px;
      width: 100%;
      max-width: 100%;
      margin: 0 auto;
      overflow-x: auto;
    }
    .pixel {
      width: 10px;
      height: 10px;
      background-color: #1e40af;
      transition: background-color 0.3s ease;
    }
    .pixel:hover {
      background-color: #3b82f6;
      cursor: pointer;
    }
    .pixel img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .sold {
      background-color: transparent !important;
      padding: 0;
    }
    .selected {
      background-color: #fbbf24 !important;
    }
    .neon-glow {
      color: #00ffff;
      text-shadow: 0 0 5px #00ffff, 0 0 10px #00ffff, 0 0 20px #ff00ff, 0 0 30px #ff00ff;
    }
  </style>
</head>
<body>

  <header class="text-center py-10">
    <h1 class="text-4xl md:text-6xl font-bold neon-glow mb-2">Return of Million Dollar Homepage</h1>
    <p class="text-gray-300 text-sm md:text-base mb-6 px-4 max-w-xl mx-auto">
      100,000 interactive pixels. Click to explore brands. Be part of the viral wall.
    </p>
    <p class="text-sm text-white mb-2">Each pixel costs $1.5</p>
    <p class="text-yellow-400 text-base font-semibold mb-4" id="selectedCount">Selected Pixels: 0 | Total: $0.00</p>
    <button id="buyNowBtn" class="bg-yellow-400 hover:bg-yellow-500 text-black px-6 py-3 rounded-full font-bold transition">
      Buy Now – $0.00
    </button>
    <p id="viewerCount" class="text-sm text-purple-400 mt-4"></p>
  </header>

  <main class="overflow-x-auto px-2">
    <div id="pixelGrid" class="pixel-grid"></div>
  </main>

  <footer class="text-center text-gray-500 text-sm py-6">
    &copy; <span id="year"></span> 100K Pixels – Built with nostalgia.
  </footer>

  <script>
    document.getElementById("year").innerText = new Date().getFullYear();

    const pixelGrid = document.getElementById("pixelGrid");
    const selectedCountDisplay = document.getElementById("selectedCount");
    const buyNowBtn = document.getElementById("buyNowBtn");

    const customers = [
      { logo: "https://logo.clearbit.com/monday.com", url: "https://monday.com" },
      { logo: "https://logo.clearbit.com/clickup.com", url: "https://clickup.com" },
      { logo: "https://logo.clearbit.com/semrush.com", url: "https://semrush.com" },
      { logo: "https://logo.clearbit.com/hubspot.com", url: "https://hubspot.com" },
      { logo: "https://logo.clearbit.com/airbnb.com", url: "https://airbnb.com" }
    ];

    let selectedPixels = [];

    for (let i = 0; i < 40000; i++) {
      const div = document.createElement("div");
      div.classList.add("pixel");

      if (Math.random() < 0.02) {
        const customer = customers[Math.floor(Math.random() * customers.length)];
        div.classList.add("sold");
        div.innerHTML = `<a href="${customer.url}" target="_blank" rel="noopener"><img src="${customer.logo}" alt="logo" /></a>`;
      } else {
        div.addEventListener("click", () => {
          if (div.classList.contains("selected")) {
            div.classList.remove("selected");
            selectedPixels = selectedPixels.filter(el => el !== i);
          } else {
            div.classList.add("selected");
            selectedPixels.push(i);
          }
          updateBuyInfo();
        });
      }

      pixelGrid.appendChild(div);
    }

    function updateBuyInfo() {
      const count = selectedPixels.length;
      const total = count * 1.5;
      selectedCountDisplay.innerText = `Selected Pixels: ${count} | Total: $${total.toFixed(2)}`;
      buyNowBtn.innerText = `Buy Now – $${total.toFixed(2)}`;
    }

    buyNowBtn.addEventListener("click", () => {
      const total = selectedPixels.length * 1.5;
      if (total === 0) return alert("Please select at least 1 pixel.");
      const paypalLink = `https://www.paypal.com/paypalme/orbitonmedia/${total.toFixed(2)}`;
      window.open(paypalLink, "_blank");
    });

    // Fake Live Viewers
    const viewer = document.getElementById("viewerCount");
    function updateViewerCount() {
      const total = Math.floor(Math.random() * (16000 - 12500 + 1)) + 12500;
      const us = Math.floor(total * 0.41);
      const uk = Math.floor(total * 0.33);
      const others = total - us - uk;
      viewer.innerHTML = `🔥 Live Visitors: ${total.toLocaleString()} | 🇺🇸 US: ${us.toLocaleString()} | 🇬🇧 UK: ${uk.toLocaleString()} | 🌍 Others: ${others.toLocaleString()}`;
    }
    setInterval(updateViewerCount, 5000);
    updateViewerCount();
  </script>

</body>
</html>
