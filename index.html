<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Return of Million Dollar Homepage</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      margin: 0;
      background-color: black;
      font-family: sans-serif;
      color: white;
    }
    .pixel-grid {
      display: grid;
      grid-template-columns: repeat(200, 1fr);
      gap: 1px;
      width: 100%;
      max-width: 100%;
      margin: 0 auto;
      overflow-x: auto;
    }
    .pixel {
      width: 10px;
      height: 10px;
      background-color: #1e40af;
      transition: background-color 0.3s ease;
    }
    .pixel:hover {
      background-color: #3b82f6;
      cursor: pointer;
    }
    .pixel img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .selected {
      background-color: #9333ea !important;
    }
    .sold {
      background-color: transparent !important;
      padding: 0;
    }
    .neon-glow {
      color: #00ffff;
      text-shadow: 0 0 5px #00ffff, 0 0 10px #00ffff, 0 0 20px #ff00ff, 0 0 30px #ff00ff;
    }
    .paypal-btn {
      background: linear-gradient(to right, #3b82f6, #9333ea);
      padding: 12px 24px;
      color: white;
      font-weight: bold;
      border-radius: 9999px;
      border: none;
      cursor: pointer;
      margin-top: 16px;
    }
  </style>
</head>
<body>

  <header class="text-center py-10">
    <h1 class="text-4xl md:text-6xl font-bold neon-glow mb-2">Return of Million Dollar Homepage</h1>
    <p class="text-gray-300 text-sm md:text-base mb-6 px-4 max-w-xl mx-auto">
      100,000 interactive pixels. Click to explore brands. Be part of the viral wall.
    </p>
    <p id="viewerCount" class="text-sm text-purple-400 mt-2"></p>
  </header>

  <main class="overflow-x-auto px-2 text-center">
    <div id="pixelGrid" class="pixel-grid mb-4"></div>
    <p id="selectedCount" class="text-lg text-green-400 mt-4">Selected Pixels: 0</p>
    <button id="buyNow" class="paypal-btn">Buy Now ($0)</button>
  </main>

  <footer class="text-center text-gray-500 text-sm py-6">
    &copy; <span id="year"></span> 100K Pixels – Built with nostalgia.
  </footer>

  <script>
    document.getElementById("year").innerText = new Date().getFullYear();
    const pixelGrid = document.getElementById("pixelGrid");
    const selectedCount = document.getElementById("selectedCount");
    const buyNowButton = document.getElementById("buyNow");

    const customers = [
      { logo: "https://logo.clearbit.com/monday.com", url: "https://monday.com" },
      { logo: "https://logo.clearbit.com/clickup.com", url: "https://clickup.com" },
      { logo: "https://logo.clearbit.com/semrush.com", url: "https://semrush.com" },
      { logo: "https://logo.clearbit.com/hubspot.com", url: "https://hubspot.com" },
      { logo: "https://logo.clearbit.com/airbnb.com", url: "https://airbnb.com" }
    ];

    let selectedPixels = [];

    for (let i = 0; i < 40000; i++) {
      const div = document.createElement("div");
      div.classList.add("pixel");

      if (Math.random() < 0.02) {
        const customer = customers[Math.floor(Math.random() * customers.length)];
        div.classList.add("sold");
        div.innerHTML = `<a href="${customer.url}" target="_blank" rel="noopener"><img src="${customer.logo}" alt="logo" /></a>`;
      } else {
        div.addEventListener("click", () => {
          if (div.classList.contains("selected")) {
            div.classList.remove("selected");
            selectedPixels = selectedPixels.filter(p => p !== i);
          } else {
            div.classList.add("selected");
            selectedPixels.push(i);
          }
          const price = (selectedPixels.length * 1.5).toFixed(2);
          selectedCount.textContent = `Selected Pixels: ${selectedPixels.length}`;
          buyNowButton.textContent = `Buy Now ($${price})`;
        });
      }

      pixelGrid.appendChild(div);
    }

    buyNowButton.addEventListener("click", () => {
      if (selectedPixels.length === 0) {
        alert("Please select some pixels before purchasing.");
        return;
      }
      const amount = (selectedPixels.length * 1.5).toFixed(2);
      const paypalUrl = `https://www.paypal.com/checkoutnow?client-id=Ac97ydK3P6gj-Bolu8sLZzPB5woh53WVAmhvm5F5f-vbFCjHfliSqmIRtmJ_CgkB7g90yDikgZ4s-bnO&currency=USD&amount=${amount}`;
      window.open(paypalUrl, "_blank");
    });

    function updateViewerCount() {
      const total = Math.floor(Math.random() * (16000 - 12500 + 1)) + 12500;
      const us = Math.floor(total * 0.41);
      const uk = Math.floor(total * 0.33);
      const others = total - us - uk;

      document.getElementById("viewerCount").innerHTML = `🔥 Live Visitors: ${total.toLocaleString()} | 🇺🇸 US: ${us.toLocaleString()} | 🇬🇧 UK: ${uk.toLocaleString()} | 🌍 Others: ${others.toLocaleString()}`;
    }
    setInterval(updateViewerCount, 5000);
    updateViewerCount();
  </script>
</body>
</html>
