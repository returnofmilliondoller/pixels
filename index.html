<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Return of Million Dollar Homepage</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

  <style>
    body {
      margin: 0;
      background-color: black;
      font-family: sans-serif;
      color: white;
    }
    .pixel-grid {
      display: grid;
      grid-template-columns: repeat(200, 1fr);
      gap: 1px;
      width: 100%;
      max-width: 100%;
      margin: 0 auto;
      overflow-x: auto;
    }
    .pixel {
      width: 10px;
      height: 10px;
      background-color: #1e40af;
      transition: background-color 0.3s ease;
    }
    .pixel:hover {
      background-color: #3b82f6;
      cursor: pointer;
    }
    .pixel img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .sold {
      background-color: transparent !important;
      padding: 0;
    }
    .neon-glow {
      color: #00ffff;
      text-shadow: 0 0 5px #00ffff, 0 0 10px #00ffff, 0 0 20px #ff00ff, 0 0 30px #ff00ff;
    }
  </style>
</head>

<body>
  <header class="text-center py-6">
    <h1 class="text-4xl md:text-6xl font-bold neon-glow mb-2">Return of Million Dollar Homepage</h1>
    <p class="text-gray-300 text-sm md:text-base mb-6 px-4 max-w-xl mx-auto">
      100,000 interactive pixels. Click to explore brands. Be part of the viral wall.
    </p>
    <p class="text-sm text-white mb-2">Each pixel costs <strong>$1.5</strong></p>
    <p id="viewerCount" class="text-sm text-purple-400 mt-2"></p>
  </header>

  <main class="overflow-x-auto px-2">
    <div id="pixelGrid" class="pixel-grid"></div>
  </main>

  <footer class="text-center text-gray-500 text-sm py-6">
    &copy; <span id="year"></span> 100K Pixels – Built with nostalgia.
  </footer>

  <!-- Initialize Firebase -->
  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyCY8_tUTZPRROclSVBoGvfkIR4VQEkNe44",
      authDomain: "pixel-a99c5.firebaseapp.com",
      projectId: "pixel-a99c5",
      storageBucket: "pixel-a99c5.firebasestorage.app",
      messagingSenderId: "954156725764",
      appId: "1:954156725764:web:55508a0278aea048f9a751",
      measurementId: "G-5Z32WGXEXV"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
  </script>

  <!-- Pixel Grid & Live Viewers Script -->
  <script>
    document.getElementById("year").innerText = new Date().getFullYear();

    const pixelGrid = document.getElementById("pixelGrid");

    // Step 1: Create empty 40,000 pixel grid
    for (let i = 0; i < 40000; i++) {
      const div = document.createElement("div");
      div.classList.add("pixel");
      div.dataset.id = i;
      pixelGrid.appendChild(div);
    }

    // Step 2: Fetch sold pixel data from Firestore
    db.collection("pixels").get().then(snapshot => {
      snapshot.forEach(doc => {
        const data = doc.data();
        const pixelId = doc.id;
        const pixelElement = document.querySelector(`.pixel[data-id='${pixelId}']`);
        if (pixelElement && data.logo && data.url) {
          pixelElement.classList.add("sold");
          pixelElement.innerHTML = `<a href="${data.url}" target="_blank" rel="noopener"><img src="${data.logo}" alt="Logo" /></a>`;
        }
      });
    });

    // Step 3: Fake viewer count
    const viewer = document.getElementById("viewerCount");
    function updateViewerCount() {
      const total = Math.floor(Math.random() * (16000 - 12500 + 1)) + 12500;
      const us = Math.floor(total * 0.41);
      const uk = Math.floor(total * 0.33);
      const others = total - us - uk;

      viewer.innerHTML = `🔥 Live Visitors: ${total.toLocaleString()} | 🇺🇸 US: ${us.toLocaleString()} | 🇬🇧 UK: ${uk.toLocaleString()} | 🌍 Others: ${others.toLocaleString()}`;
    }
    setInterval(updateViewerCount, 5000);
    updateViewerCount();
  </script>
</body>
</html>
