<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Return of Million Dollar Homepage</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://www.paypal.com/sdk/js?client-id=AeEaJmreVA21maz2aNFi1FN-uXQQwD4VQxfq_WrVhSKwf0Ecs-t7SgSB5GZKvqAhvPNQu7FxH1e5tIIq&currency=USD"></script>
  <style>
    body {
      margin: 0;
      background-color: black;
      font-family: sans-serif;
      color: white;
    }
    .pixel-grid {
      display: grid;
      grid-template-columns: repeat(200, 1fr);
      gap: 1px;
      max-width: 100%;
      margin: 0 auto;
    }
    .pixel {
      width: 12px;
      height: 12px;
      background-color: #1e40af;
      transition: background-color 0.3s ease;
    }
    .pixel:hover {
      background-color: #3b82f6;
      cursor: pointer;
    }
    .sold img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .selected {
      background-color: #ec4899 !important;
    }
    .neon-glow {
      color: #00ffff;
      text-shadow: 0 0 5px #00ffff, 0 0 10px #00ffff, 0 0 20px #ff00ff, 0 0 30px #ff00ff;
    }
  </style>
</head>
<body>

  <header class="text-center py-10">
    <h1 class="text-4xl md:text-6xl font-bold neon-glow mb-2">Return of Million Dollar Homepage</h1>
    <p class="text-gray-300 text-sm md:text-base mb-6 px-4 max-w-xl mx-auto">
      100,000 interactive pixels. Click to explore brands. Be part of the viral wall.
    </p>
    <div class="text-center text-sm mb-2">
      Each pixel costs <strong>$1.5</strong><br/>
      <span id="selectedCount">Selected Pixels: 0</span> | 
      <span id="totalCost">Total: $0.00</span>
    </div>
    <div id="paypal-button-container" class="flex justify-center mb-4"></div>
    <p id="viewerCount" class="text-sm text-purple-400 mt-2"></p>
  </header>

  <main class="overflow-x-auto px-2">
    <div id="pixelGrid" class="pixel-grid"></div>
  </main>

  <footer class="text-center text-gray-500 text-sm py-6">
    &copy; <span id="year"></span> 100K Pixels – Built with nostalgia.
  </footer>

  <script>
    document.getElementById("year").innerText = new Date().getFullYear();

    const pixelGrid = document.getElementById("pixelGrid");
    const selectedCountSpan = document.getElementById("selectedCount");
    const totalCostSpan = document.getElementById("totalCost");
    const pricePerPixel = 1.5;
    const totalPixels = 40000;
    const selected = [];

    for (let i = 0; i < totalPixels; i++) {
      const div = document.createElement("div");
      div.classList.add("pixel");
      div.setAttribute("data-id", i + 1);

      div.addEventListener("click", () => {
        if (div.classList.contains("selected")) {
          div.classList.remove("selected");
          selected.splice(selected.indexOf(i + 1), 1);
        } else {
          div.classList.add("selected");
          selected.push(i + 1);
        }
        updateSelectionInfo();
      });

      pixelGrid.appendChild(div);
    }

    function updateSelectionInfo() {
      selectedCountSpan.textContent = `Selected Pixels: ${selected.length}`;
      totalCostSpan.textContent = `Total: $${(selected.length * pricePerPixel).toFixed(2)}`;
    }

    // Fake Live Viewers
    const viewer = document.getElementById("viewerCount");
    function updateViewerCount() {
      const total = Math.floor(Math.random() * (16000 - 12500 + 1)) + 12500;
      const us = Math.floor(total * 0.41);
      const uk = Math.floor(total * 0.33);
      const others = total - us - uk;
      viewer.innerHTML = `🔥 Live Visitors: ${total.toLocaleString()} | 🇺🇸 US: ${us.toLocaleString()} | 🇬🇧 UK: ${uk.toLocaleString()} | 🌍 Others: ${others.toLocaleString()}`;
    }
    setInterval(updateViewerCount, 5000);
    updateViewerCount();

    // PayPal Button Setup
    paypal.Buttons({
      createOrder: function(data, actions) {
        return actions.order.create({
          purchase_units: [{
            amount: {
              value: (selected.length * pricePerPixel).toFixed(2)
            }
          }]
        });
      },
      onApprove: function(data, actions) {
        return actions.order.capture().then(function(details) {
          const formLink = "https://docs.google.com/forms/d/e/1FAIpQLSf-VbSRxiSihC-TepZUF42GSyyYTXe_H9e0mLywOpEZqG-JyA/viewform";
          window.location.href = formLink + "?pixels=" + encodeURIComponent(selected.join(','));
        });
      }
    }).render('#paypal-button-container');
  </script>
</body>
</html>
